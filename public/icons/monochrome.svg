<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="2">
    <line x1="128" y1="60" x2="128" y2="452"/>
    <line x1="256" y1="60" x2="256" y2="452"/>
    <line x1="384" y1="60" x2="384" y2="452"/>
    <line x1="60" y1="128" x2="452" y2="128"/>
    <line x1="60" y1="256" x2="452" y2="256"/>
    <line x1="60" y1="384" x2="452" y2="384"/>
  </g>
  <!-- Set square / triangle -->
  <path d="M 110 390 L 110 140 L 370 390 Z"
        fill="none" stroke="#ffffff" stroke-width="24"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Right angle mark -->
  <path d="M 110 358 L 142 358 L 142 390"
        fill="none" stroke="#ffffff" stroke-width="12"
        stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Drafting pencil -->
  <g transform="rotate(-38, 290, 220)">
    <rect x="270" y="100" width="40" height="200" rx="6" fill="#ffffff"/>
    <polygon points="270,300 310,300 290,345" fill="#ffffff" fill-opacity="0.85"/>
    <polygon points="278,335 302,335 290,345" fill="#ffffff"/>
    <rect x="270" y="95" width="40" height="18" rx="4" fill="#ffffff" fill-opacity="0.6"/>
  </g>
  <!-- Ruler tick marks -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round">
    <line x1="152" y1="390" x2="152" y2="370"/>
    <line x1="194" y1="390" x2="194" y2="370"/>
    <line x1="236" y1="390" x2="236" y2="370"/>
    <line x1="278" y1="390" x2="278" y2="370"/>
    <line x1="320" y1="390" x2="320" y2="370"/>
  </g>
</svg>
